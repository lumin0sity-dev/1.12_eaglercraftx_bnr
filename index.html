		<script type="text/javascript">
			"use strict";
			// IndexedDB mitigation for sporadic:
// InvalidStateError: Failed to execute 'transaction' on 'IDBDatabase': The database connection is closing.
(function installIndexedDBMitigation() {
	try {
		if (typeof window.IDBDatabase === "undefined" || !window.IDBDatabase || !window.IDBDatabase.prototype) return;

		let shuttingDown = false;

		window.addEventListener("pagehide", () => { shuttingDown = true; }, { capture: true });
		document.addEventListener("visibilitychange", () => {
			if (document.visibilityState === "hidden") shuttingDown = true;
		}, { capture: true });

		const origTxn = window.IDBDatabase.prototype.transaction;
		if (typeof origTxn !== "function" || origTxn.__eaglerMitigated) return;

		function shouldRetry(e) {
			const name = (e && e.name) ? String(e.name) : "";
			const msg = (e && e.message) ? String(e.message) : "";
			return name === "InvalidStateError" && /connection is closing/i.test(msg);
		}

		function wrappedTransaction(storeNames, mode, options) {
			if (shuttingDown) {
				throw new DOMException("Aborted due to shutdown", "AbortError");
			}
			try {
				return origTxn.call(this, storeNames, mode, options);
			} catch (e) {
				if (shouldRetry(e)) {
					return origTxn.call(this, storeNames, mode, options); // retry once
				}
				throw e;
			}
		}

		wrappedTransaction.__eaglerMitigated = true;
		window.IDBDatabase.prototype.transaction = wrappedTransaction;
	} catch (e) {
		console.warn("IndexedDB mitigation failed to install:", e);
	}
})();
			window.addEventListener("load", function() {
				if(window.location.href.indexOf("file:") === 0) {
					alert("HTTP please, do not open this file locally, run a local HTTP server and load it via HTTP");
				}else {
					
					// %%%%%%%%% launch options %%%%%%%%%%%%
					
					var relayId = Math.floor(Math.random() * 3);
					window.eaglercraftXOpts = {
						demoMode: false,
						container: "game_frame",
						assetsURI: "assets.epw",
						worldsDB: "worlds",
						servers: [
							/* example: { addr: "ws://localhost:8081/", name: "Local test server" } */
						],
						relays: [
							{ addr: "wss://relay.deev.is/", comment: "lax1dude relay #1", primary: relayId == 0 },
							{ addr: "wss://relay.lax1dude.net/", comment: "lax1dude relay #2", primary: relayId == 1 },
							{ addr: "wss://relay.shhnowisnottheti.me/", comment: "ayunami relay #1", primary: relayId == 2 }
						]
					};
					
					// %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%
					
					var q = window.location.search;
					if((typeof q === "string") && q[0] === "?" && (typeof window.URLSearchParams !== "undefined")) {
						q = new window.URLSearchParams(q);
						var s = q.get("server");
						if(s) window.eaglercraftXOpts.joinServer = s;
					}
					
					main();
					
					// Initialize experimental texture injection system
					if (window.WebGLTextureInjector && window.WebGLTextureInjector.isEnabled()) {
						console.log('[ExperimentalInit] Starting texture injection system...');
						
						// Initialize game patcher first
						if (window.GamePatcher) {
							window.GamePatcher.initialize();
						}
						
						// Initialize item detector
						if (window.ItemDetector) {
							window.ItemDetector.start();
						}
						
						// Initialize texture loader
						if (window.TextureLoader) {
							window.TextureLoader.initialize().then(function() {
								console.log('[ExperimentalInit] Textures loaded');
								
								// Wait for WebGL context to be available (with timeout)
								var checkWebGL;
								var retryCount = 0;
								var maxRetries = 30; // 30 seconds max
								checkWebGL = setInterval(function() {
									retryCount++;
									if (window.WebGLTextureInjector.getContext()) {
										clearInterval(checkWebGL);
										
										// Convert textures to WebGL format
										window.TextureLoader.convertToWebGL();
										
										// Build texture atlas
										if (window.TextureAtlasBuilder) {
											window.TextureAtlasBuilder.build();
											window.TextureAtlasBuilder.createWebGLTexture();
											console.log('[ExperimentalInit] Texture atlas built');
										}
										
										console.log('[ExperimentalInit] Initialization complete');
									} else if (retryCount >= maxRetries) {
										clearInterval(checkWebGL);
										console.warn('[ExperimentalInit] WebGL context not available after', maxRetries, 'seconds, giving up');
									}
								}, 1000);
							}).catch(function(error) {
								console.error('[ExperimentalInit] Failed to initialize:', error);
							});
						}
					} else {
						console.log('[ExperimentalInit] Experimental features disabled');
					}
					
				}
			});
		</script>

	<body style="margin:0px;width:100%;height:100%;overflow:hidden;background-color:black;" id="game_frame"></body>
